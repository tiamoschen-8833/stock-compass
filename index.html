<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="用財報數字理解企業，練習成長、獲利品質與風險判讀。">

<title>財報羅盤</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: 深色儀表側欄 + 右側工作區；卡片只用在指標格，段落以編號區塊區分 */
:root{
  --bg:#f3f4f6; --surface:#ffffff; --sunk:#eceef2; --ink:#14213d; --muted:#5c6679; --line:#dde1e8;
  --accent:#a8771f; --accent-soft:#f5ead2; --side:#14213d; --side-ink:#e9ecf3; --side-muted:#8e98ad;
  --up:#d1302b; --down:#11864f; --good:#1f63a8; --good-soft:#e3edf8; --warn:#b97409; --warn-soft:#fbf0dc; --bad:#b0303f; --bad-soft:#f8e3e6;
  --ma5:#c9541b; --ma20:#2b62c4; --ma60:#7a4fb5;
  --f-display:"Noto Serif TC","Songti TC",serif; --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif; --f-num:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e131d; --surface:#161d2a; --sunk:#111722; --ink:#e7eaf0; --muted:#9aa4b6; --line:#283245;
  --accent:#d8a64a; --accent-soft:#3a2f1a; --side:#0a0e16; --side-ink:#e7eaf0; --side-muted:#7f8aa0;
  --up:#ff5b54; --down:#2fbf72; --good:#62a2ea; --good-soft:#1a2a40; --warn:#e3a640; --warn-soft:#3a2d14; --bad:#ec6b7d; --bad-soft:#3c1d24;
  --ma5:#ff8a4c; --ma20:#6d9cf0; --ma60:#b08ae6; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e131d; --surface:#161d2a; --sunk:#111722; --ink:#e7eaf0; --muted:#9aa4b6; --line:#283245;
  --accent:#d8a64a; --accent-soft:#3a2f1a; --side:#0a0e16; --side-ink:#e7eaf0; --side-muted:#7f8aa0;
  --up:#ff5b54; --down:#2fbf72; --good:#62a2ea; --good-soft:#1a2a40; --warn:#e3a640; --warn-soft:#3a2d14; --bad:#ec6b7d; --bad-soft:#3c1d24;
  --ma5:#ff8a4c; --ma20:#6d9cf0; --ma60:#b08ae6; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6}
button,input,select{font:inherit;color:inherit}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.side{background:var(--side);color:var(--side-ink);padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:22px}
.brand{display:flex;gap:12px;align-items:center}
.brand .mark{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--accent);display:grid;place-items:center;font-family:var(--f-display);font-weight:900;color:var(--accent);font-size:19px}
.brand b{display:block;font-family:var(--f-display);font-size:19px;letter-spacing:.06em}
.brand small{color:var(--side-muted);font-size:12px;letter-spacing:.08em}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:var(--side-muted);font-size:14.5px}
.nav button .ic{width:20px;text-align:center;font-family:var(--f-num)}
.nav button:hover{color:var(--side-ink);background:rgba(255,255,255,.05)}
.nav button[aria-current="page"]{color:var(--side-ink);background:rgba(216,166,74,.16);box-shadow:inset 2px 0 0 var(--accent)}
.nav button:focus-visible{outline:2px solid var(--accent)}
.nav .tag{margin-left:auto;font-size:10.5px;font-family:var(--f-num);color:var(--accent);border:1px solid currentColor;border-radius:4px;padding:0 4px}
.side .foot{margin-top:auto;font-size:12px;color:var(--side-muted);line-height:1.5}
.side .foot .who{color:var(--side-ink);font-size:13px}
.main{min-width:0;padding-block:22px 48px;padding-left:28px;padding-right:max(28px,env(safe-area-inset-right,0px))}
.top{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.top h1{font-family:var(--f-display);font-weight:900;font-size:28px;margin:0;letter-spacing:.03em;text-wrap:balance}
.eyebrow{font-family:var(--f-num);font-size:11.5px;letter-spacing:.14em;color:var(--accent);text-transform:uppercase}
.top .sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:3px 10px;border-radius:99px;background:var(--sunk);color:var(--muted);border:1px solid var(--line)}
.pill.ok::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--good)}
.pill.wait::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--warn)}
.btn{cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 13px;font-size:14px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn:focus-visible,.chip:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn.pri{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.btn.gold{background:var(--accent);color:#1b1408;border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.sm{padding:4px 9px;font-size:13px}
.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:18px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:12px;color:var(--muted)}
.field select,.field input{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 10px;min-width:150px;max-width:100%}
.field.grow{flex:1;min-width:180px}
.field.grow input{width:100%}
.banner{border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:14px;border:1px solid var(--line);background:var(--sunk)}
.banner.warn{background:var(--warn-soft);border-color:transparent;color:var(--ink)}
.banner.info{background:var(--good-soft);border-color:transparent}
.hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px 22px;margin-bottom:22px}
.hero h2{margin:0;font-family:var(--f-display);font-size:30px;font-weight:900;letter-spacing:.02em}
.hero h2 .code{font-family:var(--f-num);font-size:18px;color:var(--muted);font-weight:500;margin-left:8px}
.meta{display:flex;flex-wrap:wrap;gap:6px 20px;font-size:13px;color:var(--muted);margin-top:6px}
.meta b{color:var(--ink);font-weight:500}
.score{display:flex;align-items:center;gap:16px}
.ring{position:relative;width:96px;height:96px}
.ring svg{transform:rotate(-90deg)}
.ring .v{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1}
.ring .v b{font-family:var(--f-num);font-size:28px}
.ring .v small{display:block;font-size:11px;color:var(--muted);margin-top:3px}
.acts{display:flex;flex-direction:column;gap:8px}
.sec{margin-top:28px}
.sec-h{display:flex;align-items:baseline;gap:12px;margin-bottom:12px;border-bottom:1px solid var(--line);padding-bottom:8px}
.sec-h .n{font-family:var(--f-num);color:var(--accent);font-size:14px}
.sec-h h3{margin:0;font-size:19px;font-family:var(--f-display);font-weight:600}
.sec-h p{margin:0;color:var(--muted);font-size:13px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.grid.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.grid.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
.grid.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:1100px){.grid.g3{grid-template-columns:1fr}}
.h-row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.st.bull{background:var(--bad-soft);color:var(--up)} .st.bear{background:var(--good-soft);color:var(--down)} .st.flat{background:var(--sunk);color:var(--muted)}
table.mini-t th,table.mini-t td{padding:6px 8px;font-size:13px}
@media (max-width:1100px){.grid.g4,.grid.g5{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.grid.g4,.grid.g5{grid-template-columns:1fr}}
.m{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px 14px;display:flex;flex-direction:column;gap:3px;min-width:0}
.m .h{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:13.5px;color:var(--muted)}
.m .val{font-family:var(--f-num);font-size:23px;font-weight:600;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.m .sub{font-size:12.5px;color:var(--muted)}
.m .note{font-size:12px;color:var(--muted);border-top:1px dashed var(--line);padding-top:6px;margin-top:4px;overflow-wrap:anywhere}
.st{font-size:11.5px;border-radius:5px;padding:1px 7px;font-weight:500;white-space:nowrap}
.st.good{background:var(--good-soft);color:var(--good)}
.st.warn{background:var(--warn-soft);color:var(--warn)}
.st.bad{background:var(--bad-soft);color:var(--bad)}
.st.na{background:var(--sunk);color:var(--muted)}
.m.good{box-shadow:inset 3px 0 0 var(--good)} .m.warn{box-shadow:inset 3px 0 0 var(--warn)} .m.bad{box-shadow:inset 3px 0 0 var(--bad)}
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--muted)}
.two{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:14px;margin-top:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.panel h4{margin:0 0 2px;font-size:15.5px}
.panel .cap{margin:0 0 10px;color:var(--muted);font-size:12.5px}
.qrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:9px 0;border-bottom:1px solid var(--line)}
.qrow:last-child{border-bottom:0}
.qrow .k{font-size:14px}
.qrow .v{font-family:var(--f-num);font-weight:600;text-align:right}
.qrow .d{grid-column:1/-1;font-size:12px;color:var(--muted);font-family:var(--f-num)}
.read{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.read:last-child{border:0}
.read .i{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700}
.read .i.good{background:var(--good-soft);color:var(--good)} .read .i.warn{background:var(--warn-soft);color:var(--warn)} .read .i.bad{background:var(--bad-soft);color:var(--bad)}
.read b{display:block;font-size:14.5px}
.read p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.verdict{margin-top:16px;border-radius:12px;padding:16px 18px;background:var(--accent-soft);display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.verdict .t{flex:1;min-width:220px}
.verdict b{font-size:15.5px;display:block;margin-bottom:3px}
.verdict p{margin:0;font-size:14px}
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{font-size:12.5px;color:var(--muted);font-weight:500;background:var(--sunk);position:sticky;top:0}
td:first-child,th:first-child{text-align:left}
tbody tr:hover td{background:var(--sunk)}
td.best{color:var(--good);font-weight:700}
.nm b{display:block}
.nm small{color:var(--muted);font-size:12px;white-space:normal}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 12px;font-size:13px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.tags{display:inline-flex;gap:4px;flex-wrap:wrap}
.tg{font-size:11px;border:1px solid var(--line);border-radius:4px;padding:0 5px;color:var(--muted)}
.tg.adv{border-color:var(--warn);color:var(--warn)}
.star{all:unset;cursor:pointer;font-size:17px;color:var(--muted);padding:0 4px}
.star[aria-pressed="true"]{color:var(--accent)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.kpi small{color:var(--muted);font-size:12.5px}
.kpi b{display:block;font-family:var(--f-num);font-size:24px;margin:2px 0}
.kpi span{font-size:12px;color:var(--muted)}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-family:var(--f-num);font-size:11px}
.chart .grid line{stroke:var(--line)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:14px;height:3px;vertical-align:middle;margin-right:4px;border-radius:2px}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:14px}
.steps .panel b{font-family:var(--f-num);color:var(--accent);font-size:13px}
.steps .panel h4{margin:2px 0 4px}
.steps .panel p{margin:0;font-size:13px;color:var(--muted)}
.cards{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.cardc{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px}
.cardc.wc{cursor:pointer;transition:border-color .15s}
.cardc.wc:hover{border-color:var(--accent)}
.cardc.wc:focus-visible{outline:2px solid var(--accent)}
.cardc .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.mini{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;font-size:12px;color:var(--muted)}
.mini b{display:block;color:var(--ink);font-family:var(--f-num);font-size:14px}
.mini b.up{color:var(--up)} .mini b.down{color:var(--down)}
.empty{text-align:center;padding:44px 16px;background:var(--surface);border:1px dashed var(--line);border-radius:14px;color:var(--muted)}
.empty b{display:block;font-size:17px;color:var(--ink);margin:6px 0}
.foot-notes{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-top:22px}
.foot-notes .panel p{margin:0;font-size:13px;color:var(--muted)}
.modal-bg{position:fixed;inset:0;background:rgba(10,14,22,.5);display:grid;place-items:center;z-index:50;padding:16px}
.modal{background:var(--surface);border-radius:14px;width:min(560px,100%);max-height:86vh;overflow:auto;padding:20px;border:1px solid var(--line)}
.modal h3{margin:0 0 4px;font-family:var(--f-display)}
.modal .x{float:right}
.list{display:flex;flex-direction:column;margin-top:10px;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.list .it{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid var(--line)}
.list .it:last-child{border:0}
.toast{position:fixed;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:10px;font-size:14px;z-index:60;max-width:min(420px,calc(100% - 36px))}
.progress{height:4px;background:var(--sunk);border-radius:2px;overflow:hidden;margin-top:8px}
.progress i{display:block;height:100%;background:var(--accent);transition:width .3s}
.mbar-top{display:none}
.bt-list{display:grid;gap:12px}
.bt-grid{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.4fr);gap:16px;margin-top:10px}
.bt-rule{margin-bottom:8px}
.bt-rt{font-size:12.5px;color:var(--accent);font-weight:500;margin-bottom:2px}
.bt-it{display:flex;gap:8px;align-items:flex-start;padding:4px 0;border-bottom:1px dashed var(--line)}
.bt-it .st{flex:none;margin-top:2px;min-width:62px;text-align:center}
.bt-it b{font-size:13.5px;font-weight:500;display:block}
.bt-it small{font-size:12px;color:var(--muted);display:block}
.bt-foot{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:13px}
.bt-foot b{display:block;font-size:13px;margin-bottom:2px}
.bt-foot div div{color:var(--muted)}
@media (max-width:900px){.bt-grid,.bt-foot{grid-template-columns:1fr}}
.detail{margin-top:14px}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{position:sticky;top:env(safe-area-inset-top,0px);height:auto;z-index:20;padding-block:10px;padding-right:max(16px,env(safe-area-inset-right,0px));gap:8px}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--side)}
  .brand .mark{width:30px;height:30px;font-size:14px} .brand b{font-size:16px} .brand small{display:none}
  .nav{flex-direction:row;overflow-x:auto;scrollbar-width:none}
  .nav button{padding:6px 10px;white-space:nowrap;font-size:13.5px}
  .nav button[aria-current="page"]{box-shadow:inset 0 -2px 0 var(--accent)}
  .side .foot{display:none}
  .main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .two,.steps{grid-template-columns:1fr}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .hero{grid-template-columns:1fr}
}
@media (max-width:480px){.top h1{font-size:23px}.hero h2{font-size:24px}.field select,.field input{min-width:0;width:100%}.bar .field{flex:1 1 100%}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body style="margin:0">


<div class="app">
  <aside class="side">
    <div class="brand"><div class="mark">財</div><div><b>財報羅盤</b><small>台股選股學習系統</small></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="foot"><div class="who" id="who">本機模式</div><div id="whoNote">資料僅供學習研究</div></div>
  </aside>
  <main class="main" id="main"></main>
</div>

/* ---------- 財報校正：偵測累計值並換算單季 ---------- */
const AMT = ['Revenue','GrossProfit','OperatingIncome','PreTaxIncome','IncomeAfterTaxes','EquityAttributableToOwnersOfParent','OperatingExpenses'];
function shares(c,k){ const b=c.bs[k] || c.bs[Object.keys(c.bs).sort().at(-1)]; return b?.OrdinaryShare ? b.OrdinaryShare/10 : null; }
function normalize(c){
  const mm={}; for(const [ym,v] of c.mr) mm[ym]=v;
  const keys=Object.keys(c.fs).sort(), out={}, fixed=[];
  for(const k of keys){
    const [y,mo]=k.split('-').map(Number), q=mo/3, raw=c.fs[k], s={...raw};
    if(q>1){
      const prev=[]; for(let i=1;i<q;i++) prev.push(`${y}-${String(i*3).padStart(2,'0')}`);
      if(prev.every(p=>out[p])){
        const ytd={}; for(const f of [...AMT,'EPS']) ytd[f]=prev.reduce((a,p)=>a+(out[p][f]||0),0);
        const rev=raw.Revenue; let cum=false;
        const qm=[0,1,2].map(i=>mm[y*100+mo-i]); const ym=[]; for(let i=1;i<=mo;i++) ym.push(mm[y*100+i]);
        if(rev!=null && qm.every(v=>v!=null) && ym.every(v=>v!=null)){
          const a=qm.reduce((x,z)=>x+z,0), b=ym.reduce((x,z)=>x+z,0); cum=Math.abs(rev-b)<Math.abs(rev-a);
        } else if(rev!=null && out[prev.at(-1)].Revenue) cum = rev > 1.6*out[prev.at(-1)].Revenue;
        if(cum){
          for(const f of AMT) if(raw[f]!=null) s[f]=raw[f]-ytd[f];
          const sh=shares(c,k);
          if(raw.EPS!=null && sh){
            const calc=(s.EquityAttributableToOwnersOfParent ?? s.IncomeAfterTaxes)/sh, c2=+(raw.EPS-ytd.EPS).toFixed(2);
            s.EPS = Math.abs(raw.EPS-calc) <= Math.abs(c2-calc) ? raw.EPS : c2;
          }
          fixed.push(k);
        }
      }
    }
    out[k]=s;
  }
  return {q:out, fixed};
}

/* ---------- 指標與判讀 ---------- */
const RULE = (v,good,warn,dir=1) => v==null||!isFinite(v) ? 'na' : (dir>0 ? (v>=good?'good':v>=warn?'warn':'bad') : (v<=good?'good':v<=warn?'warn':'bad'));
const ST_TXT = {good:'健康',warn:'留意',bad:'警示',na:'無資料'};
const PEN = {good:0,warn:1,bad:2,na:0};
const memo = new Map();
function analyze(id){
  const c=co(id); if(!c) return null;
  const key=id+'|'+(c.upd||'snap'); if(memo.has(key)) return memo.get(key);
  const {q,fixed}=normalize(c); const keys=Object.keys(q).sort(); const L=keys.at(-1);
  const [y,mo]=L.split('-').map(Number), nq=mo/3;
  const yk=yr=>Array.from({length:nq},(_,i)=>`${yr}-${String((i+1)*3).padStart(2,'0')}`);
  const cur=yk(y), prv=yk(y-1);
  const sum=(ks,f)=>ks.every(k=>q[k]&&q[k][f]!=null)?ks.reduce((a,k)=>a+q[k][f],0):null;
  const g=(a,b)=>a!=null&&b?a/Math.abs(b)-1:null;
  const rev=sum(cur,'Revenue'), revP=sum(prv,'Revenue'), gp=sum(cur,'GrossProfit'), oi=sum(cur,'OperatingIncome');
  const pti=sum(cur,'PreTaxIncome'), ni=sum(cur,'IncomeAfterTaxes'), nip=sum(cur,'EquityAttributableToOwnersOfParent');
  const eps=sum(cur,'EPS'), epsP=sum(prv,'EPS');
  const lastPx=c.px.at(-1), prevPx=c.px.at(-2);
  const ttm=keys.slice(-4).every(k=>q[k].EPS!=null)?keys.slice(-4).reduce((a,k)=>a+q[k].EPS,0):null;
  const pe = c.per?.[0] ?? (ttm>0 ? lastPx[4]/ttm : null);
  const bs=c.bs[L]||{}, bsP=c.bs[`${y-1}-${String(mo).padStart(2,'0')}`]||{};
  const cf=c.cf[L]||{};
  const prevK=keys.at(-2), sq=q[L], pq=q[prevK]||{};
  const cfo=cf.CashFlowsFromOperatingActivities, capex=cf.PropertyAndPlantAndEquipment;
  const M = {
    period:`${y} Q${nq} 累計 vs ${y-1} Q${nq} 累計`, L, prevK, nq, fixed,
    rev, revP, revYoY:g(rev,revP), gm:gp!=null&&rev?gp/rev:null, om:oi!=null&&rev?oi/rev:null, oi, pti, ni, nip,
    eps, epsP, epsYoY:g(eps,epsP), pe, pbr:c.per?.[1], dy:c.per?.[2], perDate:c.per?.[3],
    price:lastPx?.[4], chg:lastPx&&prevPx?lastPx[4]/prevPx[4]-1:null, pxDate:lastPx?.[0],
    debt:bs.Liabilities&&bs.TotalAssets?bs.Liabilities/bs.TotalAssets:null, liab:bs.Liabilities, ta:bs.TotalAssets,
    roe:nip!=null&&bs.EquityAttributableToOwnersOfParent?nip*(4/nq)/bs.EquityAttributableToOwnersOfParent:null,
    cashRatio:cfo!=null&&ni?cfo/ni:null, cfo, capex, fcf:cfo!=null&&capex!=null?cfo+capex:null,
    arG:g(bs.AccountsReceivableNet,bsP.AccountsReceivableNet), invG:g(bs.Inventories,bsP.Inventories),
    qoq:{rev:[sq.Revenue,pq.Revenue], oi:[sq.OperatingIncome,pq.OperatingIncome], pti:[sq.PreTaxIncome,pq.PreTaxIncome], ni:[sq.IncomeAfterTaxes,pq.IncomeAfterTaxes], eps:[sq.EPS,pq.EPS]},
    years:annual(c)
  };
  M.arGap = M.arG!=null&&M.revYoY!=null ? M.arG-M.revYoY : null;
  M.invGap = M.invG!=null&&M.revYoY!=null ? M.invG-M.revYoY : null;
  M.s = {
    revYoY:RULE(M.revYoY,.1,0), gm:RULE(M.gm,.3,.15), om:RULE(M.om,.15,.05), pti:RULE(M.pti,1e-9,-Infinity)==='good'?'good':(M.pti==null?'na':'bad'),
    eps:M.eps==null?'na':M.eps>0?'good':'bad', pe:M.pe==null?'na':M.pe<=0?'bad':RULE(M.pe,20,35,-1), debt:RULE(M.debt,.5,.7,-1),
    epsYoY:RULE(M.epsYoY,0,-.2), cashRatio:RULE(M.cashRatio,.8,.3), fcf:M.fcf==null?'na':M.fcf>0?'good':'warn',
    arGap:RULE(M.arGap,.1,.3,-1), invGap:RULE(M.invGap,.1,.3,-1)
  };
  const W={revYoY:6,gm:4,om:5,pti:6,eps:5,pe:3,debt:4,epsYoY:5,cashRatio:6,fcf:4,arGap:5,invGap:5};
  let score=100; for(const [k,s] of Object.entries(M.s)) score-=W[k]*PEN[s];
  M.score=Math.max(0,Math.round(score));
  memo.set(key,M); return M;
}
function annual(c){
  const y={}; for(const [ym,v] of c.mr){const yr=Math.floor(ym/100); (y[yr]=y[yr]||{n:0,v:0}); y[yr].n++; y[yr].v+=v;}
  return Object.entries(y).map(([yr,o])=>({yr:+yr,v:o.v,full:o.n===12,n:o.n})).sort((a,b)=>a.yr-b.yr).slice(-6);
}
function readings(M){
  const r=[];
  if(M.om!=null) r.push(M.om>=.15?['good','本業獲利能力良好',`每 100 元營收約留下 ${(M.om*100).toFixed(1)} 元營業利益。請繼續比較毛利率與營業費用趨勢。`]
    : M.om>=.05?['warn','本業利潤偏薄',`營業利益率 ${(M.om*100).toFixed(1)}%，需留意原物料、匯率或價格競爭對毛利的影響。`]
    : ['bad','本業幾乎不賺錢',`營業利益率僅 ${(M.om*100).toFixed(1)}%，獲利可能主要依賴業外，應查明來源。`]);
  if(M.oi!=null&&M.pti!=null){ const nop=(M.pti-M.oi)/Math.abs(M.pti||1);
    r.push(Math.abs(nop)<=.2?['good','EPS 與本業方向大致一致','稅前淨利主要來自本業；若淨利大增但營業利益沒有同步，應查處分、匯兌或投資收益。']
      :['warn','業外損益比重偏高',`業外約占稅前淨利 ${(nop*100).toFixed(0)}%，請查閱財報附註中的處分、匯兌或投資收益。`]); }
  if(M.cashRatio!=null) r.push(M.cashRatio>=.8?['good','獲利有現金支撐',`營業現金流約為淨利的 ${M.cashRatio.toFixed(2)} 倍。`]
    :['warn','帳上獲利尚未轉成現金',`現金獲利比 ${M.cashRatio.toFixed(2)} 倍，請比對應收帳款與存貨是否同步膨脹。`]);
  if(M.arGap!=null&&M.arGap>.1) r.push(['warn','應收帳款增速快於營收',`應收帳款年增 ${pct(M.arG)}，比營收增速高 ${(M.arGap*100).toFixed(1)} 個百分點，需確認收款條件是否放寬。`]);
  if(M.invGap!=null&&M.invGap>.1) r.push(['warn','存貨增速快於營收',`存貨年增 ${pct(M.invG)}，比營收增速高 ${(M.invGap*100).toFixed(1)} 個百分點，留意庫存去化與跌價損失。`]);
  return r;
}
function verdict(M){
  const bad=Object.values(M.s).filter(s=>s==='bad').length, warn=Object.values(M.s).filter(s=>s==='warn').length;
  if(bad===0&&warn<=2) return ['營收、獲利與現金流方向大致健康','下一步應與同業比較，並確認目前股價是否已反映成長（本益比 '+nf(M.pe,1)+' 倍）。'];
  if(bad<=1) return ['基本面多數健康，但有幾項需要追蹤',`共有 ${warn} 項「留意」、${bad} 項「警示」，請優先檢查標示的項目，再決定是否列入觀察名單。`];
  return ['財報出現多項警訊','先釐清營收衰退、現金流或負債的原因，不宜只看本益比或股價跌深就進場。'];
}

/* ---------- 技術指標 ---------- */
const MA=(arr,n,i)=>i+1<n?null:arr.slice(i+1-n,i+1).reduce((a,b)=>a+b,0)/n;
function RSI(cl,n=14){ if(cl.length<=n) return null; let g=0,l=0;
  for(let i=1;i<=n;i++){const d=cl[i]-cl[i-1]; d>0?g+=d:l-=d;} g/=n; l/=n;
  for(let i=n+1;i<cl.length;i++){const d=cl[i]-cl[i-1]; g=(g*(n-1)+(d>0?d:0))/n; l=(l*(n-1)+(d<0?-d:0))/n;}
  return l===0?100:100-100/(1+g/l); }

let tabId=null;
async function bget(params){
  const url=FM+params; let r;
  if(S.direct!==false){
    try{ const res=await fetch(url); const j=await res.json(); S.direct=true;
      if(j.status!==200) throw {code:'finmind', message:j.msg||'FinMind 回傳錯誤'}; return j.data; }
    catch(e){ if(e.code==='finmind') throw e; if(S.direct) throw {code:'no_net', message:e.message}; S.direct=false; }
  }
  if(!S.mcp) throw {code:'no_host'};
  if(!tabId){ r=await S.mcp.callTool(HOST,'preview_start',{url},{cache:false});
    const t=(r.content||[]).map(b=>b.text||'').join(' '); const m=t.match(/tabId\s+([\w-]+)/); tabId=m?m[1]:null; }
  else await S.mcp.callTool(HOST,'navigate',{url,tabId},{cache:false});
  r=await S.mcp.callTool(HOST,'get_page_text',{tabId,max_chars:3000000},{cache:false});
  const text=(r.content||[]).map(b=>b.text||'').join('');
  const a=text.indexOf('{"'), b=text.lastIndexOf('}');
  if(a<0) throw {code:'parse', message:'頁面沒有回傳資料'};
  const j=JSON.parse(text.slice(a,b+1));
  if(j.status!==200) throw {code:'finmind', message:j.msg||'FinMind 回傳錯誤'};
  return j.data;
}
const dstr = d => d.toISOString().slice(0,10);
const M6 = v => v==null?null:Math.round(v/1e6);
function pick(rows,types,conv=M6){const m={}; for(const x of rows){ if(types.includes(x.type)){ const k=x.date.slice(0,7); (m[k]=m[k]||{})[x.type]= x.type==='EPS'?x.value:conv(x.value);} } return m;}
async function fetchCompany(id, step){
  const now=new Date(), y2=new Date(now); y2.setFullYear(now.getFullYear()-2);
  const y1=new Date(now); y1.setFullYear(now.getFullYear()-1); y1.setMonth(0,1);

  step('基本資料'); const info=(await bget(`dataset=TaiwanStockInfo&data_id=${id}`))[0]||{};
  step('損益表'); const fs=pick(await bget(`dataset=TaiwanStockFinancialStatements&data_id=${id}&start_date=${dstr(y2)}`),['Revenue','GrossProfit','OperatingIncome','PreTaxIncome','IncomeAfterTaxes','EquityAttributableToOwnersOfParent','EPS','OperatingExpenses']);
  step('資產負債表'); const bs=pick(await bget(`dataset=TaiwanStockBalanceSheet&data_id=${id}&start_date=${dstr(y1)}`),['TotalAssets','Liabilities','AccountsReceivableNet','Inventories','Equity','EquityAttributableToOwnersOfParent','OrdinaryShare']);
  step('現金流量表'); const cf=pick(await bget(`dataset=TaiwanStockCashFlowsStatement&data_id=${id}&start_date=${dstr(y1)}`),['CashFlowsFromOperatingActivities','PropertyAndPlantAndEquipment']);
  step('月營收'); const mr=(await bget(`dataset=TaiwanStockMonthRevenue&data_id=${id}&start_date=${dstr(y5)}`)).map(x=>[x.revenue_year*100+x.revenue_month,M6(x.revenue)]);
  step('日成交'); const px=(await bget(`dataset=TaiwanStockPrice&data_id=${id}&start_date=${dstr(d200)}`)).map(x=>[x.date,x.open,x.max,x.min,x.close,Math.round(x.Trading_Volume/1000)]);
  step('本益比'); const pr=(await bget(`dataset=TaiwanStockPER&data_id=${id}&start_date=${dstr(new Date(now-14*864e5))}`)).at(-1);
  const d110=dstr(new Date(now-110*864e5));

  const im={}; for(const x of ins){ const r=(im[x.date]=im[x.date]||[x.date,0,0,0]); const n=(x.buy-x.sell)/1000; if(/^Foreign/.test(x.name)) r[1]+=n; else if(x.name==='Investment_Trust') r[2]+=n; else if(/^Dealer/.test(x.name)) r[3]+=n; }

function hostError(e){
  const c=e?.code;
  if(c==='no_net') return '無法連線到 FinMind，請確認網路連線後再試一次。';
  if(c==='no_host'||c==='server_not_connected'||c==='not_granted'||c==='capability_disabled') return '即時更新需要在 Claude 桌面 App 中開啟本頁（由內建瀏覽器向 FinMind 取數）。目前先顯示已保存的資料。';

  if(c==='finmind') return 'FinMind 拒絕請求：'+e.message+'（免費額度約每小時 300 次，請稍後再試）';
  return '更新失敗：'+(e?.message||c||'未知錯誤');
}

function yearBars(ys){

}

/* ---------- 籌碼面 ---------- */
function chipOf(id){ return co(id)?.chip || DATA.co[id]?.chip || null; }
function chipEval(id){
  const ch=chipOf(id), c=co(id); if(!ch||!c) return null;
  const adj=adjPx(c.px).adjusted||[]; const cut=adj.length?adj[0]:null;   // 股本變動日之前的張數不可比
  const after=rows=>cut?rows.filter(r=>r[0]>=cut):rows;
  const inst=after(ch.inst||[]), hold=ch.hold||[], mg=after(ch.mg||[]);
  const sum=(n,k)=>inst.slice(-n).reduce((a,r)=>a+r[k],0);
  const streak=k=>{ let n=0,sg=0; for(let t=inst.length-1;t>=0;t--){ const s=Math.sign(inst[t][k]); if(!s) break; if(!sg) sg=s; if(s!==sg) break; n++; } return n*sg; };
  const px=c.px, vol20=px.slice(-20).reduce((a,x)=>a+x[5],0)/Math.min(20,px.length);
  const back=(arr,n,k)=>arr.length>n?arr.at(-1)[k]-arr.at(-1-n)[k]:null;
  const pchg=(arr,n,k)=>arr.length>n&&arr.at(-1-n)[k]?arr.at(-1)[k]/arr.at(-1-n)[k]-1:null;
  const p20=px.length>20?px.at(-1)[4]/px.at(-21)[4]-1:null;
  const E={inst,hold,mg,cut,vol20,p20,
    instDate:inst.at(-1)?.[0], holdDate:hold.at(-1)?.[0], mgDate:mg.at(-1)?.[0],
    net:{1:[1,2,3].map(k=>sum(1,k)),5:[1,2,3].map(k=>sum(5,k)),20:[1,2,3].map(k=>sum(20,k))},
    fStreak:streak(1), tStreak:streak(2),
    ratio:hold.at(-1)?.[1], d5:back(hold,5,1), d20:back(hold,20,1), d60:back(hold,60,1),
    mBal:mg.at(-1)?.[1], sBal:mg.at(-1)?.[2], mLim:mg.at(-1)?.[3], m5:pchg(mg,5,1), m20:pchg(mg,20,1), s20:pchg(mg,20,2)};
  E.usage=E.mBal!=null&&E.mLim?E.mBal/E.mLim:null; E.ssr=E.mBal?E.sBal/E.mBal:null;
  const t5=E.net[5].reduce((a,b)=>a+b,0);
  E.instTone=t5>vol20*.05?'bull':t5<-vol20*.05?'bear':'flat';
  E.holdTone=E.d20==null?'flat':E.d20>.3?'bull':E.d20<-.3?'bear':'flat';
  E.mgTone=E.m20==null||p20==null?'flat':(E.m20>.1&&p20<0)?'bear':(E.m20<-.1&&p20>0)?'bull':(E.usage>.6)?'bear':'flat';
  const R=[];
  const [f5,t5b]=E.net[5];
  if(f5>0&&t5b>0) R.push(['bull','外資、投信近 5 日同步買超','兩大法人方向一致，籌碼相對有支撐。']);
  else if(f5<0&&t5b<0) R.push(['bear','外資、投信近 5 日同步賣超','法人一致調節，需留意股價壓力。']);
  else if(f5*t5b<0) R.push(['flat','外資與投信方向分歧',`外資近 5 日${f5>0?'買':'賣'}超 ${nf(Math.abs(f5),0)} 張，投信${t5b>0?'買':'賣'}超 ${nf(Math.abs(t5b),0)} 張，觀察誰的力道延續。`]);
  if(Math.abs(E.fStreak)>=3) R.push([E.fStreak>0?'bull':'bear',`外資連續 ${Math.abs(E.fStreak)} 日${E.fStreak>0?'買':'賣'}超`,'連續性比單日金額更能反映法人態度。']);
  if(Math.abs(E.tStreak)>=3) R.push([E.tStreak>0?'bull':'bear',`投信連續 ${Math.abs(E.tStreak)} 日${E.tStreak>0?'買':'賣'}超`,'投信常有季底作帳或結帳賣壓，需搭配時點判讀。']);
  if(E.d20!=null) R.push([E.holdTone,`外資持股比例 20 日${E.d20>0?'增加':E.d20<0?'減少':'持平'} ${Math.abs(E.d20).toFixed(2)} 個百分點`,E.holdTone==='flat'?'變化不大，外資態度中性。':E.d20>0?'外資持續加碼，屬中長線資金流入。':'外資持續減碼，留意是否為長線調節。']);
  if(E.m20!=null&&p20!=null){
    if(E.m20>.1&&p20<0) R.push(['bear','融資增加但股價下跌',`融資 20 日 ${pct(E.m20)}、股價 ${pct(p20)}，散戶逢低承接，若續跌可能出現斷頭賣壓。`]);
    else if(E.m20<-.1&&p20>0) R.push(['bull','融資減少而股價上漲',`融資 20 日 ${pct(E.m20)}、股價 ${pct(p20)}，籌碼由散戶移往法人，結構較健康。`]);
    else if(E.m20>.1&&p20>0) R.push(['flat','融資與股價同步增加','追價資金進場，短線熱度升高，留意過熱。']);
  }
  if(E.usage!=null&&E.usage>.6) R.push(['bear','融資使用率偏高',`融資使用率 ${pct(E.usage,false)}，散戶槓桿程度高。`]);
  if(E.ssr!=null&&E.ssr>.3) R.push(['flat','券資比偏高',`券資比 ${pct(E.ssr,false)}，空單回補可能帶來軋空，但也代表看空者多。`]);
  if(!R.length) R.push(['flat','籌碼面變化不明顯','法人、外資持股與信用交易都沒有明顯訊號。']);
  E.read=R; return E;
}
const TONE_TXT={bull:'偏多',bear:'偏空',flat:'中性'};
function toneTag(t){ return `<span class="st ${t}">${TONE_TXT[t]}</span>`; }
const zhang=v=>v==null?'—':(v>0?'+':'')+nf(v,0);
function netBars(inst,n=20){
  const seg=inst.slice(-n); if(!seg.length) return '';

  seg.forEach((r,i)=>{ const v=tot[i], h=Math.abs(v)/mx*(mid-8); g+=`<rect x="${P+i*bw+bw*.15}" y="${v>=0?mid-h:mid}" width="${bw*.7}" height="${Math.max(1,h)}" fill="${v>=0?'var(--up)':'var(--down)'}"><title>${r[0]}：${zhang(v)} 張</title></rect>`; });
  g+=`<text x="${P}" y="${H+12}">${seg[0][0].slice(5).replace('-','/')}</text><text x="${W-P}" y="${H+12}" text-anchor="end">${seg.at(-1)[0].slice(5).replace('-','/')}</text></svg>`;
  return g;
}
function lineSpark(arr,k,W=520,H=90,col='var(--ink)'){

}

  const names=['外資','投信','自營商'];
  h+=`<div class="grid g3">
  <div class="panel"><div class="h-row"><h4>三大法人買賣超</h4>${toneTag(E.instTone)}</div><p class="cap">單位：張｜資料日 ${E.instDate}</p>

function candle(px,days){
  const cl=px.map(x=>x[4]); const start=Math.max(0,px.length-days), seg=px.slice(start);
  const W=920,H=380,L=56,R=14,T=14,PH=250,VT=PH+T+26,VH=70; const bw=(W-L-R)/seg.length;
  const ma=n=>seg.map((_,i)=>MA(cl,n,start+i));
  const m5=ma(5),m20=ma(20),m60=ma(60);
  const hi=Math.max(...seg.map(x=>x[2]),...m20.filter(Boolean)), lo=Math.min(...seg.map(x=>x[3]),...m20.filter(Boolean));
  const pad=(hi-lo)*.06, top=hi+pad, bot=lo-pad, Y=v=>T+(top-v)/(top-bot)*PH; const vmax=Math.max(...seg.map(x=>x[5]));
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="K 線圖"><g class="grid">`;
  for(let i=0;i<=4;i++){const v=bot+(top-bot)*i/4, y=Y(v); s+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}"/><text x="${L-6}" y="${y+4}" text-anchor="end">${v>=1000?Math.round(v):v.toFixed(v<20?2:1)}</text>`;}
  s+=`<line x1="${L}" x2="${W-R}" y1="${VT+VH}" y2="${VT+VH}"/></g>`;
  seg.forEach((x,i)=>{const [d,o,hh,ll,c,v]=x; const cx=L+i*bw+bw/2, col=c>=o?'var(--up)':'var(--down)', w=Math.max(1,bw*.62);
    s+=`<line x1="${cx}" x2="${cx}" y1="${Y(hh)}" y2="${Y(ll)}" stroke="${col}" stroke-width="1"/><rect x="${cx-w/2}" y="${Math.min(Y(o),Y(c))}" width="${w}" height="${Math.max(1,Math.abs(Y(o)-Y(c)))}" fill="${col}"/>`;
    const vh=v/vmax*VH; s+=`<rect x="${cx-w/2}" y="${VT+VH-vh}" width="${w}" height="${vh}" fill="${col}" opacity=".55"/>`;});
  const line=(arr,col)=>{const pts=arr.map((v,i)=>v==null?null:`${L+i*bw+bw/2},${Y(v)}`).filter(Boolean); return pts.length>1?`<polyline points="${pts.join(' ')}" fill="none" stroke="${col}" stroke-width="1.6"/>`:'';};
  s+=line(m60,'var(--ma60)')+line(m20,'var(--ma20)')+line(m5,'var(--ma5)');
  const tick=[0,Math.floor(seg.length/2),seg.length-1]; tick.forEach(i=>{s+=`<text x="${Math.min(W-R-20,Math.max(L+20,L+i*bw+bw/2))}" y="${H-4}" text-anchor="middle">${seg[i][0].slice(5).replace('-','/')}</text>`;});
  s+=`<text x="${L}" y="${VT-6}">成交量（張）</text></svg>`; return s;
}

const ETF_TYPES=['全部','台股市值','高股息','主動式','海外股票','債券','商品／期貨','槓桿／反向'];
function etfType(code,name){
  if(/[LR]$/.test(code)||/正2|反1|正向|反向/.test(name)) return '槓桿／反向';
  if(/B$/.test(code)||/債/.test(name)) return '債券';
  if(/U$/.test(code)||/^期|黃金|原油|石油|白銀|黃豆|VIX/.test(name)) return '商品／期貨';
  if(/A$/.test(code)||/^主動/.test(name)) return '主動式';
  if(/美|日本|日經|韓|KOSPI|全球|費城|NASDAQ|S&P|FANG|中國|滬深|上証|印度|越南|歐洲|亞|PCB|不動產|富時/.test(name)) return '海外股票';
  if(/高息|高股息|收益|優息|股利|填息/.test(name)) return '高股息';
  return '台股市值';
}
const ETF_DESC={'台股市值':'追蹤台股大型或主題指數，成分股與權重依指數規則調整。','高股息':'以殖利率或配息穩定度選股，需注意填息能力與成分股產業集中。','主動式':'由經理人主動選股，持股可隨時調整，費用率通常較高，需看經理人紀錄。','海外股票':'投資海外市場，報酬受當地股市與匯率雙重影響。','債券':'以債券為主，價格與利率走勢反向；長天期債券對利率更敏感。','商品／期貨':'透過期貨追蹤商品價格，有轉倉成本，長期報酬可能偏離現貨。','槓桿／反向':'追求「單日」報酬的倍數或反向，長期持有會因複利偏離，適合短線且需嚴控風險。'};

/* ---------- 除權／分割還原：台股單日漲跌幅上限 10%，超過 11% 視為股本變動並向前還原 ---------- */
const ADJ=new WeakMap();
function adjPx(px){
  if(!px||px.length<2) return px; if(ADJ.has(px)) return ADJ.get(px);
  const out=px.map(x=>x.slice()); let f=1; const evs=[];
  for(let t=out.length-1;t>0;t--){ const r=px[t][1]/px[t-1][4]; if(Math.abs(px[t][4]/px[t-1][4]-1)>.11 && (r<.89||r>1.12)){ f*=r; evs.push(px[t][0]); }
    if(f!==1){ const x=out[t-1]; x[1]=px[t-1][1]*f; x[2]=px[t-1][2]*f; x[3]=px[t-1][3]*f; x[4]=px[t-1][4]*f; x[5]=px[t-1][5]/f; } }
  out.adjusted=evs; ADJ.set(px,out); return out;
}
/* ---------- 技術面打底判讀 ---------- */
const BT={win:60, minDays:45, retestDays:5, rebound:.05, retrace:.5, surge:.04, volShrink:.8, volBreak:1.5, boTol:.03};
const ST3={ok:'符合', no:'尚未符合', na:'資料不足'};
function bottomEval(px,i){
  px=adjPx(px);
  const R={items:{},notes:[],status:'尚未打底',falseBO:false,L:null,R:null};
  const it=(k,s,d)=>{R.items[k]={s,d};};
  if(i==null||i<BT.minDays){ for(const k of ['1a','1b','1c','2a','2b','2c','3a','3b','3c']) it(k,'na','可用交易日不足 '+BT.minDays+' 日'); R.status='資料不足'; return R; }
  const H=x=>px[x][2], Lo=x=>px[x][3], C=x=>px[x][4], V=x=>px[x][5];
  const cl=px.slice(0,i+1).map(x=>x[4]); const ma=(n,x)=>MA(cl,n,x);
  // 以近 60 日最高點為下跌起點，之後的最低點為「前低」
  const s=Math.max(0,i-BT.win+1);
  let iP=s; for(let t=s;t<=i;t++) if(H(t)>=H(iP)) iP=t;
  let iL=iP; for(let t=iP;t<=i;t++) if(Lo(t)<=Lo(iL)) iL=t;

    <div class="bt-foot"><div><b>與前一交易日差異</b>${diffs.length?diffs.map(d=>`<div>• ${d}</div>`).join(''):'<div>• 各項判定與前一交易日相同</div>'}</div>
      <div><b>仍欠缺的條件</b><div>${SG_GATES.flatMap(([g,t,ks])=>ks.filter(([k])=>E.gates[g]?.items?.[k]?.s!=='ok').map(([k,l])=>`${g}-${l}`)).join('、')||'四道閘門皆已通過'}</div></div>
      <div><b>結構備註</b>${E.notes.map(n=>`<div>• ${n}</div>`).join('')}</div></div></div>`;
}
function sgSpark(px,i,E){
  const s=Math.max(0,i-79), seg=px.slice(s,i+1), W=360,H=120,P=4;
  const vals=[...seg.map(x=>x[2]),...seg.map(x=>x[3])]; if(E.stop) vals.push(E.stop); if(E.target&&E.target<Math.max(...vals)*1.15) vals.push(E.target);
  const hi=Math.max(...vals), lo=Math.min(...vals), r=hi-lo||1, X=t=>P+(t/(seg.length-1))*(W-2*P), Y=v=>P+(hi-v)/r*(H-2*P);
  const ln=(v,col,t)=>v==null||v>hi||v<lo?'':`<line x1="${P}" x2="${W-P}" y1="${Y(v)}" y2="${Y(v)}" stroke="${col}" stroke-dasharray="4 3"/><text x="${P+2}" y="${Y(v)-3}">${t} ${nf(v)}</text>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" style="height:${H}px" role="img" aria-label="近 80 日收盤與關鍵價位">${ln(E.L,'var(--down)','L')}${ln(E.L2&&E.L2!==E.L?E.L2:null,'var(--down)','L2')}${ln(E.H,'var(--accent)','H')}${ln(E.stop,'var(--bad)','停損')}${ln(E.target,'var(--good)','目標')}
    <polyline points="${seg.map((x,t)=>X(t)+','+Y(x[4])).join(' ')}" fill="none" stroke="var(--ink)" stroke-width="1.6"/><circle cx="${X(seg.length-1)}" cy="${Y(seg.at(-1)[4])}" r="3" fill="var(--ink)"/></svg>`;
}

/* ---------- 視圖：後台 ---------- */
function viewAdmin(){
  let h=topbar('Administration','使用者與資料管理');
  if(S.mode!=='db') return h+`<div class="empty"><b>本機模式沒有後台</b>在 Claude 中開啟這個頁面並登入後，擁有者可在此審核其他使用者。</div>`;
  if(!S.canEdit) return h+`<div class="empty"><b>只有管理者可以查看</b>後台僅開放給本頁的擁有者與編輯者。</div>`;
  h+=`<p style="margin:-8px 0 14px;color:var(--muted)">審核使用者，並查看各帳號保存的個股、群組與追蹤清單。分享本頁給同事後，他們第一次開啟就會出現在這裡。</p>`;
  if(!S.members.length) return h+`<div class="empty"><b>尚無成員資料</b>等其他人開啟本頁後就會出現。</div>`;
  h+=`<div class="cards">${S.members.map(m=>{const p=S.profiles?.[m.id]||{}; const isMe=m.id===S.uid; const st=isMe&&S.isOwner?'approved':(S.approvals[m.id]?.status||'pending');
    return `<div class="cardc"><div class="row"><div><b style="font-size:16px">${esc(p.name||'未具名使用者')}${isMe?'（你）':''}</b><div style="font-size:12.5px;color:var(--muted)">${esc(p.email||'')}</div></div><span class="st ${st==='approved'?'good':st==='rejected'?'bad':'warn'}">${{approved:'已核准',rejected:'已拒絕',pending:'待審核'}[st]}</span></div>
    <div style="font-size:13px">公司 ${m.companies?.length||0} 家：${esc((m.companies||[]).slice(0,8).map(id=>nameOf(id)+'（'+id+'）').join('、'))}${(m.companies||[]).length>8?'…':''}</div>
    <div style="font-size:13px">群組：${esc(Object.keys(m.groups||{}).join('、')||'—')}</div><div style="font-size:13px">追蹤 ${m.watch?.length||0} 家</div>
    ${isMe&&S.isOwner?'':`<div class="row" style="justify-content:flex-start;gap:8px"><button class="btn sm pri" data-act="approve" data-id="${m.id}" data-v="approved">核准</button><button class="btn sm" data-act="approve" data-id="${m.id}" data-v="rejected">拒絕</button></div>`}</div>`}).join('')}</div>`;
  return h;
}

/* ---------- Modal ---------- */
function modal(html){ $('#layer').innerHTML=`<div class="modal-bg" data-act="closeBg"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`; const f=$('#layer input'); f&&f.focus(); }
function closeModal(){ $('#layer').innerHTML=''; }
function coHits(q){
  if(/[\u3100-\u312F\u31A0-\u31BF\u02C7\u02CA\u02CB\u02D9]/.test(q)) return `<div class="it" style="color:var(--muted)">選好中文字後就會開始搜尋…</div>`;
  const hits = q ? Object.entries(DATA.stockList).filter(([id,[n]])=>id.startsWith(q)||n.includes(q)).slice(0,12) : [];
  return hits.length?hits.map(([id,[n,m,ind]])=>`<div class="it"><span><b class="num">${id}</b> ${esc(n)} <small style="color:var(--muted)">${m==='tpex'?'上櫃':'上市'}｜${esc(ind)}</small></span>${S.me.companies.includes(id)?'<span class="st na">已加入</span>':`<button class="btn sm pri" data-act="addOne" data-id="${id}">加入</button>`}</div>`).join(''):`<div class="it" style="color:var(--muted)">${q?'找不到符合的公司':'開始輸入以搜尋 '+Object.keys(DATA.stockList).length+' 家公司'}</div>`;
}
function addCoModal(q=''){
  modal(`<button class="btn sm ghost x" data-act="close">關閉</button><h3>自動加入公司</h3><p style="color:var(--muted);font-size:13.5px;margin:0 0 10px">輸入上市櫃公司代號或名稱。已有內建資料的公司會立即顯示；其他公司會自動向 FinMind 抓取財報（約需 10 秒）。</p>
    <div class="field"><label for="aq">代號或名稱</label><input id="aq" data-inp="aq" value="${esc(q)}" placeholder="例如 2412 或 中華電" autocomplete="off"></div>
    <div class="list" id="hits">${coHits(q)}</div>`);
}
function groupsModal(){
  const gs=S.me.groups;
  modal(`<button class="btn sm ghost x" data-act="close">關閉</button><h3>管理類股群組</h3><p style="color:var(--muted);font-size:13.5px;margin:0 0 10px">同業比較只會在同一群組內進行。每家公司可歸入一個群組。</p>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><input id="ng" placeholder="新群組名稱" style="flex:1;min-width:160px;border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:var(--bg)"><button class="btn pri" data-act="newGroup">新增群組</button></div>
    <div class="list">${S.me.companies.map(id=>`<div class="it"><span><b class="num">${id}</b> ${esc(nameOf(id))}</span><select data-chg="assign" data-id="${id}" style="border:1px solid var(--line);border-radius:8px;padding:4px 8px;background:var(--bg)"><option value="">未分組</option>${Object.keys(gs).map(g=>`<option ${gs[g].includes(id)?'selected':''}>${esc(g)}</option>`).join('')}</select></div>`).join('')}</div>
    <div style="margin-top:12px;display:flex;gap:6px;flex-wrap:wrap">${Object.keys(gs).map(g=>`<button class="btn sm danger" data-act="delGroup" data-v="${esc(g)}">刪除「${esc(g)}」</button>`).join('')}</div>`);
}

/* ---------- 互動 ---------- */
let toastT;
function toast(msg,ms=3200){ let el=$('.toast'); if(!el){el=document.createElement('div');el.className='toast';el.setAttribute('role','status');document.body.appendChild(el);} el.textContent=msg; clearTimeout(toastT); toastT=setTimeout(()=>el.remove(),ms); }
const A={
  nav:d=>{S.view=d.v; try{localStorage.setItem('compass-view',d.v)}catch(e){} render(true); window.scrollTo(0,0);},
  addCo:()=>addCoModal(), groups:()=>groupsModal(), close:closeModal, closeBg:(d,e)=>{ if(e.target.classList.contains('modal-bg')) closeModal(); },
  addOne:async d=>{ const id=d.id; if(!S.me.companies.includes(id)) S.me.companies.push(id); persist(); S.sel=id; S.scope='all'; S.view='health'; closeModal(); render();
    if(!co(id)) runUpdate([id],'加入 '+nameOf(id)); else toast('已加入 '+nameOf(id)); },
  watch:d=>{ const w=S.me.watch, i=w.indexOf(d.id); i<0?w.push(d.id):w.splice(i,1); persist(); render(); toast(i<0?'已加入追蹤':'已取消追蹤'); },
  delCo:d=>modal(`<h3>刪除 ${esc(nameOf(d.id))}？</h3><p>會從你的公司清單、群組與追蹤中移除，共用的財報資料不受影響。</p><div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn" data-act="close">取消</button><button class="btn pri" data-act="delYes" data-id="${d.id}">刪除</button></div>`),
  delYes:d=>{ const id=d.id; S.me.companies=S.me.companies.filter(x=>x!==id); S.me.watch=S.me.watch.filter(x=>x!==id); for(const g in S.me.groups) S.me.groups[g]=S.me.groups[g].filter(x=>x!==id); persist(); closeModal(); S.sel=S.me.companies[0]; render(); toast('已刪除'); },
  updAll:()=>runUpdate(scopeIds(),'更新全部公司'), updOne:()=>runUpdate([S.sel],'更新 '+nameOf(S.sel)), updMarket:()=>updateMarket(),
  open:d=>{S.sel=d.id; S.scope='all'; A.nav({v:'health'});}, goTech:d=>{S.tech.id=d.id; A.nav({v:'tech'});},
  days:d=>{S.tech.days=+d.v; render();},
  sgOpen:d=>{ S.sigId=d.id; A.nav({v:'signal'}); },
  updSig:()=>runUpdate([S.sigId],'更新 '+nameOf(S.sigId)),
  updWatch:()=>runUpdate(S.me.watch.filter(id=>S.me.companies.includes(id)),'更新追蹤個股'),
  btJump:d=>{ document.getElementById('bt-'+d.id)?.scrollIntoView({behavior:'smooth',block:'start'}); },
  etfFav:d=>{const f=S.me.etfFav,i=f.indexOf(d.id); i<0?f.push(d.id):f.splice(i,1); persist(); render();},
  etfFavOnly:()=>{S.etf.fav=!S.etf.fav; render();}, etfAll:()=>{S.etf.all=!S.etf.all; render();},
  etfDetail:d=>{S.etf.detail=d.id||null; render(); if(d.id) document.querySelector('.detail')?.scrollIntoView({block:'nearest'});}, cmpClear:()=>{S.etf.cmp=[]; render();},
  newGroup:()=>{ const v=$('#ng').value.trim(); if(!v) return; if(!S.me.groups[v]) S.me.groups[v]=[]; persist(); groupsModal(); },
  delGroup:d=>{ delete S.me.groups[d.v]; if(S.scope===d.v) S.scope='all'; persist(); groupsModal(); render(); },
  saveBrief:async()=>{ const date=S.brief.date; const rows=S.me.watch.map(id=>{const M=analyze(id),c=co(id),k=c?.px.findIndex(x=>x[0]===date); if(!M||k<1) return null; return {id,close:c.px[k][4],chg:c.px[k][4]/c.px[k-1][4]-1,pe:M.pe,score:M.score,bottom:bottomEval(c.px,k).status};}).filter(Boolean);
    S.briefs[date]={rows,savedAt:Date.now()};
    if(S.mode==='db'&&canWrite()){ try{ await S.db.doc(`members/${S.uid}/briefs/${date}`).set(S.briefs[date]); toast('已保存 '+date+' 快照'); }catch(e){ toast('快照保存失敗：'+(e.code||'')); } }
    else { try{localStorage.setItem('compass-briefs',JSON.stringify(S.briefs))}catch(e){} toast('已保存在此瀏覽器'); } render(); },
  approve:async d=>{ try{ await S.db.doc('approvals/'+d.id).set({status:d.v, at:Date.now(), by:S.uid}); toast(d.v==='approved'?'已核准':'已拒絕'); }catch(e){ toast('操作失敗：'+(e.code||'')); } }
};
const CHG={
  scope:v=>{S.scope=v; render();}, sel:v=>{S.sel=v; render();}, tech:v=>{S.tech.id=v; render();},
  peer:(v,d)=>{ const i=+d.i; if(i===0){S.sel=v; S.peer=[];} else S.peer[i]=v||null; render(); },
  et:v=>{S.etf.type=v; render();}, em:v=>{S.etf.mkt=v; render();}, es:v=>{S.etf.sort=v; render();}, bd:v=>{S.brief.date=v.slice(0,10); render();},
  cmp:(v,d,el)=>{ const c=S.etf.cmp; const i=c.indexOf(d.id); if(el.checked&&i<0){ if(c.length>=3){el.checked=false; toast('最多比較 3 檔'); return;} c.push(d.id);} else if(!el.checked&&i>=0) c.splice(i,1); render(); },
  cfg:(v,d)=>{ const n=+v; if(!(n>0)) return; const id=S.sigId; S.me.sigBy={...(S.me.sigBy||{}),[id]:{...sgCfg(id),[d.k]:n}}; persist(); render(); },
  cfgReset:()=>{ const b={...(S.me.sigBy||{})}; delete b[S.sigId]; S.me.sigBy=b; persist(); render(); },
  assign:(v,d)=>{ for(const g in S.me.groups) S.me.groups[g]=S.me.groups[g].filter(x=>x!==d.id); if(v) S.me.groups[v].push(d.id); persist(); render(); }
};
const INP={ q:v=>{S.q=v; renderKeep('q');}, eq:v=>{S.etf.q=v; renderKeep('eq');}, aq:v=>{ const el=$('#hits'); if(el) el.innerHTML=coHits(v.trim()); } };
document.addEventListener('click',e=>{ const el=e.target.closest('[data-act]'); if(!el||el.disabled) return; const f=A[el.dataset.act]; if(f){ if(el.dataset.act!=='closeBg') e.preventDefault(); f(el.dataset,e);} });
document.addEventListener('change',e=>{ const el=e.target.closest('[data-chg]'); if(!el) return; CHG[el.dataset.chg]?.(el.value,el.dataset,el); });
document.addEventListener('input',e=>{ if(e.isComposing) return; const el=e.target.closest('[data-inp]'); if(!el) return; INP[el.dataset.inp]?.(el.value); });
document.addEventListener('compositionstart',e=>{ if(e.target.id==='aq'){ const el=$('#hits'); if(el) el.innerHTML=`<div class="it" style="color:var(--muted)">選好中文字後就會開始搜尋…</div>`; } });
document.addEventListener('compositionend',e=>{ const el=e.target.closest?.('[data-inp]'); if(!el) return; setTimeout(()=>INP[el.dataset.inp]?.(el.value),0); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeModal(); if(e.key==='Enter'&&e.target.classList?.contains('wc')) A.sgOpen(e.target.dataset); });
function renderKeep(id){ const el=document.getElementById(id), pos=el?.selectionStart; render(); const n=document.getElementById(id); if(n){ n.focus(); try{n.setSelectionRange(pos,pos)}catch(e){} } }

function hashToken(){ return S.view + (S.view==='health'?'-'+S.sel : S.view==='tech'?'-'+S.tech.id : S.view==='signal'&&S.sigId?'-'+S.sigId : ''); }
function syncHash(push){ const t='#'+hashToken(); if(location.hash===t) return; try{ history[push?'pushState':'replaceState'](null,'',t); }catch(e){ try{ location.hash=t; }catch(_){} } }
function readHash(){
  const h=(location.hash||'').slice(1); if(!h) return false;
  const [v,id]=h.split('-'); if(!NAV.some(n=>n[0]===v)&&v!=='signal') return false;
  S.view=v; if(id){ if(v==='health'&&S.me.companies.includes(id)){S.sel=id; S.scope='all';} if(v==='tech') S.tech.id=id; if(v==='signal') S.sigId=id; }
  if(v==='signal'&&!S.sigId) S.view='watch';
  return true;
}
window.addEventListener('hashchange',()=>{ if(readHash()){ closeModal(); render(); } });
window.addEventListener('popstate',()=>{ if(readHash()){ closeModal(); render(); } });
function render(push){
  $('#nav').innerHTML=NAV.filter(([v])=>v!=='admin'||S.canEdit).map(([v,ic,t])=>`<button data-act="nav" data-v="${v}" ${S.view===v||(v==='watch'&&S.view==='signal')?'aria-current="page"':''}><span class="ic">${ic}</span>${t}${v==='etf'?'<span class="tag">V09</span>':''}</button>`).join('');
  const V={health:viewHealth,watch:viewWatch,signal:viewSignal,peer:viewPeer,tech:viewTech,etf:viewEtf,brief:viewBrief,admin:viewAdmin}[S.view]||viewHealth;
  let pre='';
  if(S.mode==='db'&&!canWrite()) pre=`<div class="banner warn">你的帳號正在等待管理者核准。核准前可以瀏覽內建資料，但加入公司、追蹤與快照不會保存。</div>`;
  $('#main').innerHTML=pre+V();
  syncHash(push);
}

/* ---------- 啟動 ---------- */
try{ const v=localStorage.getItem('compass-view'); if(v&&NAV.some(n=>n[0]===v)) S.view=v; }catch(e){}
try{ const m=JSON.parse(localStorage.getItem('compass-me')||'null'); if(m&&m.companies) S.me={...S.me,...m}; }catch(e){}
try{ S.briefs=JSON.parse(localStorage.getItem('compass-briefs')||'{}')||{}; }catch(e){}
try{ S.cache=JSON.parse(localStorage.getItem('compass-cache')||'{}')||{}; }catch(e){}
try{ S.market=JSON.parse(localStorage.getItem('compass-market')||'null'); }catch(e){}
if(!S.me.companies.includes(S.sel)) S.sel=S.me.companies[0];
readHash();
render();

(async()=>{
  if(!window.claude?.use) return;
  const [db,user,mcp]=await Promise.all([claude.use('db'),claude.use('user'),claude.use('mcp')]);
  S.mcp=mcp; S.user=user;
  if(user){ S.isOwner=await user.isOwner(); S.canEdit=await user.canEdit(); }
  if(db&&user){
    const uid=await user.id();
    if(uid){
      S.db=db; S.uid=uid; S.mode='db'; S.approved=S.isOwner;
      const me=await user.me(); $('#who').textContent=(me.name||'已登入')+(S.isOwner?'（擁有者）':''); $('#whoNote').textContent='清單跟著帳號同步';
      try{
        const snap=await db.doc('members/'+uid).get();
        if(snap.exists){ const d=snap.data(); S.joinedAt=d.joinedAt; S.me={companies:d.companies||[],groups:d.groups||{},watch:d.watch||[],etfFav:d.etfFav||[],sig:d.sig||null,sigBy:d.sigBy||{}}; }
        else { S.joinedAt=Date.now(); await db.doc('members/'+uid).set({...S.me, joinedAt:S.joinedAt, updatedAt:Date.now()}).catch(()=>{}); }
      }catch(e){}
      if(!S.me.companies.includes(S.sel)) S.sel=S.me.companies[0];
      readHash();
      db.doc('approvals/'+uid).onSnapshot(s=>{ S.approved = S.isOwner || (s.exists && s.data().status==='approved'); render(); }, ()=>{});
      db.collection('members/'+uid+'/briefs').onSnapshot(qs=>{ for(const d of qs.docs) S.briefs[d.id]=d.data(); render(); }, ()=>{});
      if(S.canEdit){
        db.collection('members').onSnapshot(async qs=>{ S.members=qs.docs.map(d=>({id:d.id,...d.data()})); S.profiles=await user.profiles(S.members.map(m=>m.id)); if(S.view==='admin') render(); }, ()=>{});
        db.collection('approvals').onSnapshot(qs=>{ S.approvals={}; for(const d of qs.docs) S.approvals[d.id]=d.data(); if(S.view==='admin') render(); }, ()=>{});
      }
    }
  }
  if(db){
    db.collection('cache').onSnapshot(qs=>{ for(const d of qs.docs){ if(d.id==='market') S.market=d.data(); else S.cache[d.id]=d.data(); } memo.clear(); if(!S.busy) render(); }, ()=>{});
  }
  render();
})();
</script>
