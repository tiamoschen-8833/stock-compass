name: 收盤後訊號檢查
on:
  schedule:
    # 台北時間週一至週五 15:35、16:05、16:35、17:35（UTC+8）；當日已完成就會略過
    - cron: '35 7 * * 1-5'
    - cron: '5 8 * * 1-5'
    - cron: '35 8 * * 1-5'
    - cron: '35 9 * * 1-5'
  workflow_dispatch:
    inputs:
      force:
        description: '即使已完成也重新計算'
        type: boolean
        default: false
permissions:
  contents: write
concurrency: signals
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm i --no-save --no-audit --no-fund jsdom@24.1.3
      - run: node scripts/signals.mjs ${{ inputs.force && '--force' || '' }}
      - name: 提交結果
        run: |
          if [ -z "$(git status --porcelain signals.json)" ]; then echo "沒有變更"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add signals.json
          git commit -m "收盤訊號 $(TZ=Asia/Taipei date +%F)"
          git pull --rebase origin main
          git push
